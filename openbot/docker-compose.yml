services:
  web:
    image: ghcr.io/nickpstone/openbot:1.1.3-1
    restart: unless-stopped
    stop_grace_period: 30s # lets the embedded PostgreSQL shut down cleanly
    environment:
      TZ: ${TZ}
    volumes:
      - ${APP_DATA_DIR}/config:/config # keys from the setup page and the credential encryption key
      - ${APP_DATA_DIR}/postgresql:/var/lib/postgresql # the embedded database: Bots, settings, audit trail
      - ${APP_DATA_DIR}/workspace:/workspace # the Bots' files
      - ${APP_DATA_DIR}/profiles:/profiles # the Bots' browser profile and logins
